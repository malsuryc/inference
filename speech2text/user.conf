# The format of this config file is 'key = value'.
# The key has the format 'model.scenario.key'. Value is mostly int64_t.
# Model maybe '*' as wildcard. In that case the value applies to all models.
# All times are in milli seconds
#

# LoadGen Offline sizes samples_per_query as ceil(target_qps * min_duration_s).
# Job 792354 measured ~5.08 samples/s on 6x RTX 4090D; we set target_qps=7 so
# the run easily exceeds the 600s min_duration floor (was INVALID before).
# Bumped to 10 for sweep: multi-GPU cells may exceed 7 s/s, and target_qps must
# stay above actual throughput to avoid INVALID (min duration not met).
whisper.Offline.target_qps = 10
